# IntelliJ Platform Artifacts Repositories
# -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

group = com.github.umbreon22.inlayenumordinals
version = 1.1.0

pluginRepositoryUrl = https://github.com/umbreon22/inlay-enum-ordinals

# IntelliJ IDEA version to build against. Its major build number (e.g. 262 for 2026.2) becomes the plugin's since-build;
# the until-build is left open, so the plugin stays installable on newer IDE versions.
# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# for insight into build numbers and IntelliJ Platform versions.
platformVersion = 2026.2.3

# Bundled plugins kept off the unit test classpath: the IntelliJ Platform Gradle Plugin defaults, plus the licensing plugin
# com.intellij.modules.ultimate. Its obfuscated Z.Z.Z.Z.Z startup activity shares its name with a class in lib/product-backend.jar,
# which the IDE's per-plugin class loaders keep apart but the flat test classpath cannot. Affects only the test JVM.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes = com.intellij.openRewrite,com.intellij.ja,com.intellij.ko,com.intellij.zh,org.jetbrains.plugins.vue,com.intellij.modules.ultimate

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
